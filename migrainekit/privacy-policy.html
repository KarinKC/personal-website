<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigraineKit — Privacy Policy</title>
    <link rel="stylesheet" href="legal.css">
</head>
<body>
    <main class="page">
        <a class="brand" href="https://www.karinkc.com/" aria-label="MigraineKit">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">MigraineKit</span>
        </a>

        <nav class="legal-nav" aria-label="Legal">
            <a href="support.html">Support</a>
            <a href="privacy-policy.html" aria-current="page">Privacy Policy</a>
        </nav>

        <h1 id="title">Privacy Policy</h1>
        <div id="content"></div>

        <footer>
            <p>MigraineKit · Migraine diary</p>
        </footer>
    </main>

    <script>
        async function fetchDocument() {
            const contentDiv = document.getElementById("content");
            try {
                const response = await fetch("privacy.json");
                if (!response.ok) throw new Error("status");
                const blocks = await response.json();
                blocks.forEach(block => {
                    if (block.type !== "heading" && block.type !== "paragraph") return;
                    const element = document.createElement(block.type === "heading" ? "h2" : "p");
                    element.textContent = block.text;
                    contentDiv.appendChild(element);
                });
            } catch (error) {
                const message = document.createElement("p");
                message.textContent = "Failed to load privacy policy.";
                contentDiv.appendChild(message);
            }
        }

        fetchDocument();
    </script>
</body>
</html>
